<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Illustration of a photo shrinking to a 20 KB file"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><style>.f{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.b{animation-delay:-2s}.c{animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-14px)}}
@keyframes ring{from{transform:scale(.7);opacity:.7}to{transform:scale(1.6);opacity:0}}
.r{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-1.4s}
@keyframes draw{from{stroke-dashoffset:700}60%,to{stroke-dashoffset:0}}
.d{stroke-dasharray:700;animation:draw 4.5s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.p{animation:pop 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p1{animation-delay:.5s}.p2{animation-delay:1.2s}.p3{animation-delay:1.9s}.p4{animation-delay:2.6s}
@keyframes sw{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes sw2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.s1{animation:sw 6s infinite}.s2{animation:sw2 6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="630" fill="url(#g)"/><g fill="#fff"><circle class="f" cx="144" cy="126" r="100.8" opacity=".10"/><circle class="f b" cx="1080" cy="491.40000000000003" r="138.6" opacity=".10"/><circle class="f c" cx="936" cy="88.2" r="44.1" opacity=".16"/></g><g class="f"><rect x="330" y="140" width="250" height="330" rx="22" fill="#fff" /><rect x="364" y="190" width="182" height="120" rx="14" fill="#c7d2fe"/><circle cx="410" cy="232" r="18" fill="#fff"/><rect x="364" y="340" width="150" height="18" rx="9" fill="#e0e7ff"/><rect x="364" y="378" width="110" height="18" rx="9" fill="#e0e7ff"/></g><path d="M620 305 h70" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M668 280 l28 25 l-28 25" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><g class="f b"><rect x="730" y="190" width="300" height="250" rx="30" fill="#fff"/><text x="880" y="338" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="110" font-weight="800" fill="#4338ca">20</text><text x="880" y="400" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="44" font-weight="700" fill="#0e7490">KB</text></g><g class="p p1"><circle cx="1030" cy="190" r="24" fill="#10b981"/><path d="M1019 190 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
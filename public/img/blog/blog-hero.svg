<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Animated illustration of photo and signature cards being optimised"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs><style>.f{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.b{animation-delay:-2s}.c{animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-14px)}}
@keyframes ring{from{transform:scale(.7);opacity:.7}to{transform:scale(1.6);opacity:0}}
.r{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-1.4s}
@keyframes draw{from{stroke-dashoffset:700}60%,to{stroke-dashoffset:0}}
.d{stroke-dasharray:700;animation:draw 4.5s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.p{animation:pop 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p1{animation-delay:.5s}.p2{animation-delay:1.2s}.p3{animation-delay:1.9s}.p4{animation-delay:2.6s}
@keyframes sw{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes sw2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.s1{animation:sw 6s infinite}.s2{animation:sw2 6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1600" height="520" fill="url(#g)"/><g fill="#fff"><circle class="f" cx="192" cy="104" r="83.2" opacity=".10"/><circle class="f b" cx="1440" cy="405.6" r="114.4" opacity=".10"/><circle class="f c" cx="1248" cy="72.80000000000001" r="36.400000000000006" opacity=".16"/></g><g class="f"><rect x="980" y="70" width="200" height="250" rx="22" fill="#fff" /><circle cx="1080" cy="160" r="34" fill="#c7d2fe"/><path d="M990 310 q90 -150 180 0z" fill="#a5b4fc"/><g><rect x="1000" y="270" width="121" height="46" rx="23" fill="#4338ca"/><text x="1018" y="301" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="700" fill="#fff">35 KB</text></g></g><g class="f b"><rect x="1230" y="180" width="250" height="130" rx="22" fill="#fff" /><path class="d" transform="translate(1255 215) scale(0.9)" d="M0 60 C20 -10 50 -10 40 50 C35 90 90 0 100 40 C105 70 140 10 160 45 C170 62 200 40 230 30" fill="none" stroke="#0e7490" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p p1"><circle cx="1180" cy="400" r="24" fill="#10b981"/><path d="M1169 400 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p p2"><circle cx="1260" cy="430" r="24" fill="#10b981"/><path d="M1249 430 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="p p3"><circle cx="1340" cy="400" r="24" fill="#10b981"/><path d="M1329 400 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
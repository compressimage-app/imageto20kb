<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Illustration of a checklist with items being ticked off"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><style>.f{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.b{animation-delay:-2s}.c{animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-14px)}}
@keyframes ring{from{transform:scale(.7);opacity:.7}to{transform:scale(1.6);opacity:0}}
.r{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-1.4s}
@keyframes draw{from{stroke-dashoffset:700}60%,to{stroke-dashoffset:0}}
.d{stroke-dasharray:700;animation:draw 4.5s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.p{animation:pop 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p1{animation-delay:.5s}.p2{animation-delay:1.2s}.p3{animation-delay:1.9s}.p4{animation-delay:2.6s}
@keyframes sw{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes sw2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.s1{animation:sw 6s infinite}.s2{animation:sw2 6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="630" fill="url(#g)"/><g fill="#fff"><circle class="f" cx="144" cy="126" r="100.8" opacity=".10"/><circle class="f b" cx="1080" cy="491.40000000000003" r="138.6" opacity=".10"/><circle class="f c" cx="936" cy="88.2" r="44.1" opacity=".16"/></g><g class="f"><rect x="400" y="110" width="400" height="420" rx="22" fill="#fff" /><rect x="520" y="86" width="160" height="50" rx="16" fill="#10172A"/><rect x="500" y="185" width="220" height="20" rx="10" fill="#e0e7ff"/><g class="p p1"><circle cx="455" cy="195" r="24" fill="#10b981"/><path d="M444 195 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="500" y="263" width="170" height="20" rx="10" fill="#e0e7ff"/><g class="p p2"><circle cx="455" cy="273" r="24" fill="#10b981"/><path d="M444 273 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="500" y="341" width="220" height="20" rx="10" fill="#e0e7ff"/><g class="p p3"><circle cx="455" cy="351" r="24" fill="#10b981"/><path d="M444 351 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="500" y="419" width="170" height="20" rx="10" fill="#e0e7ff"/><g class="p p4"><circle cx="455" cy="429" r="24" fill="#10b981"/><path d="M444 429 l8 9 l15 -17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
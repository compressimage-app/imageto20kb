<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Illustration of three image format cards labelled JPG, PNG and WebP"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#4338ca"/></linearGradient></defs><style>.f{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.b{animation-delay:-2s}.c{animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-14px)}}
@keyframes ring{from{transform:scale(.7);opacity:.7}to{transform:scale(1.6);opacity:0}}
.r{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-1.4s}
@keyframes draw{from{stroke-dashoffset:700}60%,to{stroke-dashoffset:0}}
.d{stroke-dasharray:700;animation:draw 4.5s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.p{animation:pop 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p1{animation-delay:.5s}.p2{animation-delay:1.2s}.p3{animation-delay:1.9s}.p4{animation-delay:2.6s}
@keyframes sw{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes sw2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.s1{animation:sw 6s infinite}.s2{animation:sw2 6s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="630" fill="url(#g)"/><g fill="#fff"><circle class="f" cx="144" cy="126" r="100.8" opacity=".10"/><circle class="f b" cx="1080" cy="491.40000000000003" r="138.6" opacity=".10"/><circle class="f c" cx="936" cy="88.2" r="44.1" opacity=".16"/></g><g class="f"><rect x="300" y="180" width="190" height="260" rx="22" fill="#fff" /><rect x="322" y="204" width="146" height="110" rx="14" fill="#f59e0b" opacity=".85"/><circle cx="370" cy="250" r="16" fill="#fff" opacity=".8"/><text x="395" y="380" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="38" font-weight="800" fill="#10172A">JPG</text></g><g class="f b"><rect x="510" y="130" width="190" height="260" rx="22" fill="#fff" /><rect x="532" y="154" width="146" height="110" rx="14" fill="#10b981" opacity=".85"/><circle cx="580" cy="200" r="16" fill="#fff" opacity=".8"/><text x="605" y="330" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="38" font-weight="800" fill="#10172A">PNG</text></g><g class="f c"><rect x="720" y="180" width="190" height="260" rx="22" fill="#fff" /><rect x="742" y="204" width="146" height="110" rx="14" fill="#ec4899" opacity=".85"/><circle cx="790" cy="250" r="16" fill="#fff" opacity=".8"/><text x="815" y="380" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="38" font-weight="800" fill="#10172A">WEBP</text></g></svg>